<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="250"
     viewBox="0 0 500 250">

  <!-- Background -->
  <rect
    width="500"
    height="250"
    rx="12"
    fill="#0D1117"
    stroke="#30363D"
    stroke-width="1"/>

  <!-- Title -->
  <text
    x="25"
    y="42"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700">
    Agoge Coaching
  </text>

  <!-- Subtitle -->
  <text
    x="25"
    y="68"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14">
    Software project
  </text>

  <!-- Main LOC number -->
  <text
    x="25"
    y="122"
    fill="#58A6FF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700">
    62633
  </text>

  <!-- LOC label -->
  <text
    x="25"
    y="149"
    fill="#C9D1D9"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17">
    lines of code
  </text>

  <!-- Divider -->
  <line
    x1="25"
    y1="169"
    x2="475"
    y2="169"
    stroke="#30363D"
    stroke-width="1"/>

  <!-- Technology -->
  <text
    x="25"
    y="197"
    fill="#C9D1D9"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14">
    Spring Boot • React • PostgreSQL
  </text>

  <!-- Repository information -->
  <text
    x="25"
    y="222"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12">
    ⭐ 2   🍴 0
  </text>

</svg>
