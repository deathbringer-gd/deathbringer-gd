name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      # -----------------------------------------
      # GitHub stats
      # -----------------------------------------
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_rank=true&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=C9D1D9&icon_color=58A6FF
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: false

      # -----------------------------------------
      # Top languages
      # -----------------------------------------
      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: false

      # -----------------------------------------
      # Agoge Coaching
      # -----------------------------------------
      - name: Generate Agoge Coaching card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=deathbringer-gd&repo=Agoge-Coaching&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=C9D1D9&icon_color=58A6FF
          path: profile/fullstack.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: false

      # -----------------------------------------
      # Commit generated cards
      # -----------------------------------------
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile statistics"
          git push
