name: Update GitHub Profile

on:
workflow_dispatch:

permissions:
contents: write

jobs:
stats:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Create profile directory
    run: mkdir -p profile

  - name: Generate GitHub stats
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=deathbringer-gd&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=C9D1D9&icon_color=58A6FF
      path: profile/stats.svg
      token: ${{ secrets.GH_STATS_TOKEN }}

  - name: Generate top languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=deathbringer-gd&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=C9D1D9
      path: profile/top-langs.svg
      token: ${{ secrets.GH_STATS_TOKEN }}

  - name: Generate project card
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: pin
      options: username=deathbringer-gd&repo=Agoge-Coaching&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=C9D1D9&icon_color=58A6FF
      path: profile/fullstack.svg
      token: ${{ secrets.GH_STATS_TOKEN }}

  - name: Commit
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add profile/
      git diff --cached --quiet || git commit -m "chore: update profile statistics"
      git push
```
