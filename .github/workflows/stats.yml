name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  # Update once every day
  schedule:
    - cron: "0 3 * * *"

  # Update whenever main changes
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT PROFILE REPOSITORY
      # ============================================================
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Create profile directory
        run: mkdir -p profile

      # ============================================================
      # GITHUB STATS CARD
      # ============================================================
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=deathbringer-gd&show_icons=true&include_all_commits=true&count_private=true&hide_rank=true&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=C9D1D9&icon_color=58A6FF
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      # ============================================================
      # TOP LANGUAGES CARD
      # ============================================================
      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=deathbringer-gd&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      # ============================================================
      # CLONE PRIVATE AGOGE REPOSITORY
      # ============================================================
      - name: Clone Agoge Coaching
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          rm -rf /tmp/Agoge-Coaching

          gh repo clone deathbringer-gd/Agoge-Coaching \
            /tmp/Agoge-Coaching \
            -- \
            --depth 1

          echo "Agoge repository successfully cloned."

      # ============================================================
      # CALCULATE AGOGE LINES OF CODE
      # ============================================================
      - name: Calculate Agoge lines of code
        run: |
          cd /tmp/Agoge-Coaching

          # Count non-empty lines in tracked source files.
          #
          # Included:
          # Java, JavaScript, JSX, TypeScript, TSX,
          # Python, SQL, HTML, CSS, SCSS, XML,
          # YAML and JSON.
          #
          # Git-tracked files are used so node_modules,
          # target, dist, build and other untracked generated
          # files cannot inflate the number.

          LOC=$(
            git ls-files -z |
            while IFS= read -r -d '' file; do
              case "$file" in
                *.java|*.js|*.jsx|*.ts|*.tsx|*.py|*.sql|*.html|*.css|*.scss|*.xml|*.yml|*.yaml|*.json)
                  printf '%s\0' "$file"
                  ;;
              esac
            done |
            xargs -0 awk 'NF { count++ } END { print count+0 }'
          )

          echo "Agoge lines of code: $LOC"
          echo "AGOGE_LOC=$LOC" >> "$GITHUB_ENV"

      # ============================================================
      # GET BASIC AGOGE REPOSITORY INFORMATION
      # ============================================================
      - name: Get Agoge repository information
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          gh api repos/deathbringer-gd/Agoge-Coaching \
            --jq '"AGOGE_STARS=\(.stargazers_count)\nAGOGE_FORKS=\(.forks_count)\nAGOGE_WATCHERS=\(.subscribers_count)"' \
            >> "$GITHUB_ENV"

      # ============================================================
      # GENERATE CUSTOM AGOGE SVG
      # ============================================================
      - name: Generate Agoge Coaching card
        run: |
          mkdir -p profile

          cat > profile/fullstack.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="500"
               height="250"
               viewBox="0 0 500 250">

            <!-- Background -->
            <rect
              width="500"
              height="250"
              rx="12"
              fill="#0D1117"
              stroke="#30363D"
              stroke-width="1"/>

            <!-- Title -->
            <text
              x="25"
              y="42"
              fill="#FFFFFF"
              font-family="Arial, Helvetica, sans-serif"
              font-size="24"
              font-weight="700">
              Agoge Coaching
            </text>

            <!-- Subtitle -->
            <text
              x="25"
              y="68"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14">
              Software project
            </text>

            <!-- Main LOC number -->
            <text
              x="25"
              y="122"
              fill="#58A6FF"
              font-family="Arial, Helvetica, sans-serif"
              font-size="42"
              font-weight="700">
              ${AGOGE_LOC}
            </text>

            <!-- LOC label -->
            <text
              x="25"
              y="149"
              fill="#C9D1D9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="17">
              lines of code
            </text>

            <!-- Divider -->
            <line
              x1="25"
              y1="169"
              x2="475"
              y2="169"
              stroke="#30363D"
              stroke-width="1"/>

            <!-- Technology -->
            <text
              x="25"
              y="197"
              fill="#C9D1D9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14">
              Spring Boot • React • PostgreSQL
            </text>

            <!-- Repository information -->
            <text
              x="25"
              y="222"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12">
              ⭐ ${AGOGE_STARS}   🍴 ${AGOGE_FORKS}
            </text>

          </svg>
          EOF

          echo "Generated profile/fullstack.svg"
          echo "Displayed LOC: ${AGOGE_LOC}"

      # ============================================================
      # SHOW GENERATED FILES
      # ============================================================
      - name: Verify generated cards
        run: |
          echo "Generated files:"
          ls -lh profile/

          echo
          echo "Agoge LOC:"
          echo "${AGOGE_LOC}"

          echo
          echo "SVG files:"
          for file in profile/*.svg; do
            echo "---- $file ----"
            head -n 3 "$file"
          done

      # ============================================================
      # COMMIT CHANGES
      # ============================================================
      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub profile statistics"
          git push
